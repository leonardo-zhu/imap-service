name: Deploy to Docker

on:
  push:
    branches:
      - master
      - improve/imap-heartbeat-exists-source
  workflow_dispatch:

concurrency:
  group: deploy-docker
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/imap-service

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, r4s]
    timeout-minutes: 10
    steps:
      - name: Deploy Container on Self-hosted Runner
        run: |
          set -euo pipefail
          DEPLOY_DIR="/opt/stacks/imap-service"
          
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "ERROR: 目录 $DEPLOY_DIR 不存在，请先在服务器上创建并准备好 docker-compose.yml 和 .env"
            exit 1
          fi

          cd "$DEPLOY_DIR"

          # Login to GHCR on host
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Pull latest image and restart container using local docker-compose.yml & .env
          docker compose pull
          docker compose up -d --remove-orphans

